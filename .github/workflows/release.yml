name: Authorized release draft

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Semantic release tag, for example v0.1.0
        required: true
        type: string
      confirmation:
        description: Type BUILD SIGNED RELEASE DRAFT to authorize state changes
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: authorized-release
  cancel-in-progress: false

jobs:
  release-gate:
    name: Verify protected source and all 14 release gates
    if: >-
      github.repository == 'kiranmagic7/behaviorlock' &&
      github.ref == 'refs/heads/main' &&
      vars.BEHAVIORLOCK_RELEASE_ENABLED == 'true' &&
      inputs.confirmation == 'BUILD SIGNED RELEASE DRAFT'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      checks: read
    steps:
      - name: Check out protected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.25.x
          cache: false
      - name: Collect proof checks from the exact protected commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/collect-release-proofs.sh release-proofs.json
      - name: Fail closed on missing, skipped, stale, or failed proof
        run: ./scripts/release-gate.sh release-proofs.json

  build-sign-draft:
    name: Build, sign, attest, and create a draft
    needs: release-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      RUNNER_NAME: ghcr.io/${{ github.repository_owner }}/behaviorlock-runner
      RUNNER_REF: ghcr.io/${{ github.repository_owner }}/behaviorlock-runner:${{ inputs.release_tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out protected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate the unused release tag
        run: |
          if ! printf '%s\n' "$RELEASE_TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'; then
            echo "release tag is not an exact semantic version" >&2
            exit 2
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "release tag already exists" >&2
            exit 1
          fi
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.25.x
          cache: false
      - name: Install pinned Syft
        id: syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: v1.50.0
      - name: Install pinned cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Run the complete local verification suite
        run: make check
      - name: Validate release configuration
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.1
          args: check
      - name: Build archives and SBOMs without publishing
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        env:
          GORELEASER_CURRENT_TAG: ${{ inputs.release_tag }}
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --clean --skip=publish
      - name: Build and inventory the exact runner image
        env:
          SYFT_CMD: ${{ steps.syft.outputs.cmd }}
        run: |
          docker build --pull=false --tag "$RUNNER_REF" runner
          docker image inspect "$RUNNER_REF" --format '{{.Id}}' > dist/behaviorlock-runner.content-id
          "$SYFT_CMD" scan "docker:$RUNNER_REF" --output spdx-json=dist/behaviorlock-runner.spdx.json
          sha256sum dist/behaviorlock-runner.content-id dist/behaviorlock-runner.spdx.json > dist/behaviorlock-runner-assets.sha256
      - name: Verify all release assets before signing
        run: |
          ./scripts/verify-release-assets.sh dist
          (cd dist && sha256sum --check behaviorlock-runner-assets.sha256)
      - name: Sign archive checksums without a long-lived key
        run: cosign sign-blob --yes --bundle dist/behaviorlock_checksums.sigstore.json dist/behaviorlock_checksums.txt
      - name: Attest archives and archive SBOMs
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/behaviorlock_checksums.txt
          show-summary: true
      - name: Attest runner metadata and SBOM
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/behaviorlock-runner-assets.sha256
          show-summary: true
      - name: Authenticate to the project container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish the reviewed runner image and record its registry digest
        id: runner-push
        run: |
          docker push "$RUNNER_REF"
          repository_digest="$(docker image inspect "$RUNNER_REF" --format '{{index .RepoDigests 0}}')"
          runner_digest="${repository_digest##*@}"
          if ! printf '%s\n' "$runner_digest" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "published runner did not return a registry digest" >&2
            exit 1
          fi
          printf '%s\n' "$runner_digest" > dist/behaviorlock-runner.registry-digest
          printf 'digest=%s\n' "$runner_digest" >> "$GITHUB_OUTPUT"
          cosign sign --yes "$RUNNER_NAME@$runner_digest"
      - name: Attest the published runner digest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.RUNNER_NAME }}
          subject-digest: ${{ steps.runner-push.outputs.digest }}
          push-to-registry: true
          show-summary: true
      - name: Create a draft release only after every gate and signature passes
        run: |
          gh release create "$RELEASE_TAG" \
            dist/behaviorlock_*.tar.gz \
            dist/behaviorlock_*.tar.gz.spdx.json \
            dist/behaviorlock_checksums.txt \
            dist/behaviorlock_checksums.sigstore.json \
            dist/behaviorlock-runner.content-id \
            dist/behaviorlock-runner.registry-digest \
            dist/behaviorlock-runner.spdx.json \
            dist/behaviorlock-runner-assets.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "BehaviorLock $RELEASE_TAG" \
            --generate-notes \
            --draft
