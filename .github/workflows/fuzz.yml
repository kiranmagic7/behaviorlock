name: Scheduled fuzzing

on:
  schedule:
    - cron: "41 2 * * 6"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: Bounded parser fuzzing
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: 1.23.x
          cache: false
      - name: Fuzz npm spec parser
        run: go test ./internal/npm -run='^$' -fuzz='^FuzzParseExactSpec$' -fuzztime=45s
      - name: Fuzz trace parser
        run: go test ./internal/trace -run='^$' -fuzz='^FuzzParse$' -fuzztime=45s
