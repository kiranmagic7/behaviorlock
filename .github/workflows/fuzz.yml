name: Scheduled fuzzing

on:
  schedule:
    - cron: "41 2 * * 6"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: Bounded parser fuzzing
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.23.x
          cache: false
      - name: Fuzz npm spec parser
        run: go test ./internal/npm -run='^$' -fuzz='^FuzzParseExactSpec$' -fuzztime=45s
      - name: Fuzz trace parser
        run: go test ./internal/trace -run='^$' -fuzz='^FuzzParse$' -fuzztime=45s
