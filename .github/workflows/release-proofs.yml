name: Protected release gate proofs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: protected-release-proofs-${{ github.sha }}
  cancel-in-progress: false

jobs:
  proof-suite:
    name: Build protected proof ledger
    if: github.repository == 'kiranmagic7/behaviorlock' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out protected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.25.x
          cache: false
      - name: Run all local checks
        run: make check
      - name: Build the pinned disposable runner
        run: make runner
      - name: Run the complete hardened integration
        run: ./scripts/integration-runner.sh
      - name: Write the source-bound proof ledger
        run: ./scripts/write-release-proof-ledger.sh protected-proof-ledger.json
      - name: Upload the data-only proof ledger
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: protected-proof-ledger-${{ github.sha }}
          path: protected-proof-ledger.json
          if-no-files-found: error
          retention-days: 2

  gate-proofs:
    name: ${{ matrix.check }}
    needs: proof-suite
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: gate-01
            check: gate-01-input-validation
          - id: gate-02
            check: gate-02-docker-argument-integrity
          - id: gate-03
            check: gate-03-host-secret-isolation
          - id: gate-04
            check: gate-04-filesystem-containment
          - id: gate-05
            check: gate-05-lifecycle-network-denial
          - id: gate-06
            check: gate-06-acquisition-egress
          - id: gate-07
            check: gate-07-process-observability
          - id: gate-08
            check: gate-08-tracer-fail-closed
          - id: gate-09
            check: gate-09-trace-channel-integrity
          - id: gate-10
            check: gate-10-resource-exhaustion
          - id: gate-11
            check: gate-11-unsupported-tracing
          - id: gate-12
            check: gate-12-determinism
          - id: gate-13
            check: gate-13-retained-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out protected verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download same-run data-only proof ledger
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: protected-proof-ledger-${{ github.sha }}
          path: proof-input
      - name: Reject unexpected artifact entries
        run: |
          test "$(find proof-input -mindepth 1 -maxdepth 1 -type f -name protected-proof-ledger.json | wc -l)" -eq 1
          test "$(find proof-input -mindepth 1 -maxdepth 1 | wc -l)" -eq 1
      - name: Verify exact gate evidence
        run: ./scripts/verify-release-proof-ledger.sh proof-input/protected-proof-ledger.json '${{ matrix.id }}' '${{ matrix.check }}'
