name: Release dry run

on:
  pull_request:
    paths:
      - .goreleaser.yaml
      - .github/workflows/release-dry-run.yml
      - .github/workflows/release.yml
      - cmd/**
      - config/**
      - go.mod
      - go.sum
      - internal/**
      - runner/**
      - scripts/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-dry-run-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dry-run:
    name: Release artifacts without publishing
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.25.x
          cache: false
      - name: Install pinned Syft
        id: syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: v1.50.0
      - name: Run all local checks
        run: make check
      - name: Validate release configuration
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.1
          args: check
      - name: Build snapshot archives and archive SBOMs
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --snapshot --clean
      - name: Build and inventory the runner image without publishing
        env:
          SYFT_CMD: ${{ steps.syft.outputs.cmd }}
        run: |
          docker build --pull=false --tag behaviorlock-runner:dry-run runner
          docker image inspect behaviorlock-runner:dry-run --format '{{.Id}}' > dist/behaviorlock-runner.digest
          "$SYFT_CMD" scan docker:behaviorlock-runner:dry-run --output spdx-json=dist/behaviorlock-runner.spdx.json
          sha256sum dist/behaviorlock-runner.digest dist/behaviorlock-runner.spdx.json > dist/behaviorlock-runner-assets.sha256
      - name: Verify every generated asset
        run: ./scripts/verify-release-assets.sh dist
      - name: Upload temporary verification artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dry-run-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
